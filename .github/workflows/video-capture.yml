# Captures NOAA's live weather and space weather responses for recording the intro video's Weather and Magnetic
# sections (the recording machine cannot reach NOAA). Runs only when the capture script changes on a video branch.
name: Intro video NOAA capture
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/video-capture/**']
permissions: { contents: write }
jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Record once with live NOAA data
        run: |
          (npx vite preview --port 4173 > preview.log 2>&1 &) ; sleep 6
          mkdir -p cap && CAPTURE=1 OUT=$PWD/cap node scripts/video-capture/rec-noaa.cjs
          cd cap && zip -q ../noaa-capture.zip noaa-capture.json
      - name: Upload to the narration pre-release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload narration noaa-capture.zip --clobber -R "$GITHUB_REPOSITORY"
