# Public-domain USGS map tiles and open terrain tiles around the demo project (Asheville, NC), so the
# intro video shows filled-in maps (the recording machine cannot reach the tile servers).
# Only USGS (public domain), the AWS open elevation dataset and OpenStreetMap tower points are used. Run by hand; small area.
name: Map tiles for the intro video
on:
  workflow_dispatch:
    inputs:
      lat: { required: false, default: '35.5951' }
      lon: { required: false, default: '-82.5515' }
permissions:
  contents: write
jobs:
  tiles:
    runs-on: ubuntu-24.04
    steps:
      - name: Download tiles
        env: { LAT: '${{ inputs.lat }}', LON: '${{ inputs.lon }}' }
        run: |
          python3 - <<'PY'
          import math, os, urllib.request
          lat, lon = float(os.environ['LAT']), float(os.environ['LON'])
          base = 'https://basemap.nationalmap.gov/arcgis/rest/services/'
          L = {
            'usgstopo': (base + 'USGSTopo/MapServer/tile/{z}/{y}/{x}', 16),
            'usgsimg': (base + 'USGSImageryOnly/MapServer/tile/{z}/{y}/{x}', 16),
            'usgsimgtopo': (base + 'USGSImageryTopo/MapServer/tile/{z}/{y}/{x}', 16),
            'usgsrelief': (base + 'USGSShadedReliefOnly/MapServer/tile/{z}/{y}/{x}', 16),
            'terrarium': ('https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png', 14),
          }
          ok = bad = 0
          for key, (url, zmax) in L.items():
              for z in range(4, zmax + 1):
                  n = 2 ** z; x0 = int((lon + 180) / 360 * n)
                  y0 = int((1 - math.asinh(math.tan(math.radians(lat))) / math.pi) / 2 * n)
                  r = 4 if z >= 8 else 2
                  for x in range(x0 - r, x0 + r + 1):
                      for y in range(y0 - r, y0 + r + 1):
                          p = f'tiles/{key}/{z}/{x}/{y}'
                          os.makedirs(os.path.dirname(p), exist_ok=True)
                          try:
                              req = urllib.request.Request(url.format(z=z, x=x, y=y), headers={'User-Agent': 'LvPlanPro-video-demo/1.0'})
                              open(p, 'wb').write(urllib.request.urlopen(req, timeout=30).read()); ok += 1
                          except Exception:
                              bad += 1
          print('tiles ok', ok, 'failed', bad)
          PY
          # Existing towers / comm sites (OpenStreetMap via Overpass) for the same small area, as the app requests them.
          python3 - <<'PY'
          import os, urllib.request, urllib.parse
          lat, lon = float(os.environ['LAT']), float(os.environ['LON'])
          os.makedirs('tiles/towers', exist_ok=True)
          import math
          for la in (math.floor(lat / .25) * .25 - .25, math.floor(lat / .25) * .25, math.floor(lat / .25) * .25 + .25):
              for lo in (math.floor(lon / .25) * .25 - .25, math.floor(lon / .25) * .25, math.floor(lon / .25) * .25 + .25):
                  bb = f'({la},{lo},{la + .25},{lo + .25})'
                  q = ('[out:json][timeout:30];('
                       f'nwr["man_made"~"^(mast|tower|communications_tower|antenna|telecommunication|monitoring_station)$"]["tower:type"!~"^(cooling|lighting|observation|bell_tower|watchtower|minaret|defensive|clock)$"]{bb};'
                       f'nwr["tower:type"~"communication|radar|transmission"]{bb};'
                       f'nwr["communication:mobile_phone"]{bb};nwr["communication:radio"]{bb};nwr["communication:television"]{bb};'
                       f'nwr["telecom"~"exchange|service_device|data_center"]{bb};'
                       ');out center tags 1500;')
                  req = urllib.request.Request('https://overpass-api.de/api/interpreter', data=urllib.parse.urlencode({'data': q}).encode(), headers={'User-Agent': 'LvPlanPro-video-demo/1.0'})
                  try:
                      body = urllib.request.urlopen(req, timeout=90).read()
                      open(f'tiles/towers/{la:.2f},{lo:.2f}.json', 'wb').write(body); print('towers', la, lo, len(body))
                  except Exception as e: print('towers failed', la, lo, e)
          PY
          zip -qr tiles.zip tiles
      - name: Publish as a pre-release asset (never "latest")
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view narration -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create narration -R "$GITHUB_REPOSITORY" --prerelease --latest=false --title "Intro video narration (not an app release)" --notes "Voice files for the introduction video. Not an app update."
          gh release upload narration tiles.zip --clobber -R "$GITHUB_REPOSITORY"
