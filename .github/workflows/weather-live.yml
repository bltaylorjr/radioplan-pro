# Checks the Weather & Radar page's reading of the live National Weather Service API and the NOAA radar layer.
name: Weather API live check
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/engine/weather.ts', 'src/engine/noaamaps.ts', 'src/engine/verify.ts', 'src/engine/spaceweather.ts', 'src/engine/azimuth.ts', 'src/data/wmmhr.ts', 'tests/weather*.ts', '.github/workflows/weather-live.yml']
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run tests/weather.live.test.ts tests/weather.test.ts
        env: { NWS_LIVE: '1' }
      - name: Radar layer is published
        run: curl -fsS 'https://opengeo.ncep.noaa.gov/geoserver/conus/conus_bref_qcd/ows?service=wms&version=1.3.0&request=GetCapabilities' | grep -q '<Name>conus_bref_qcd</Name>'
