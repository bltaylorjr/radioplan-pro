name: Test and publish the online version
# Publishes the online version to Cloudflare Pages (account lvplanpro, project lvplan-pro) at
# https://lvplan-pro.pages.dev/. Installed apps download their content packs from there too.
# Secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
# Files over 24 MB (the intro video) are left out there; the app plays them from the latest release instead.
# While this repository is public, the old address https://bltaylorjr.github.io/radioplan-pro/ keeps getting
# the same build so older installed apps keep working until they update.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::warning::Cloudflare secrets are not set, so the online version was not published there."; exit 0; fi
          rm -rf "$RUNNER_TEMP/cf" && cp -r dist "$RUNNER_TEMP/cf" && find "$RUNNER_TEMP/cf" -type f -size +24M -print -delete
          npx --yes wrangler@4.20.0 pages project create lvplan-pro --production-branch main || true
          npx --yes wrangler@4.20.0 pages deploy "$RUNNER_TEMP/cf" --project-name lvplan-pro --branch main --commit-dirty=true
      - if: ${{ !github.event.repository.private }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with: { path: dist }
  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
