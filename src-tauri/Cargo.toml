[package]
name = "radioplan"
version = "0.1.0"
description = "RadioPlan Pro - radio site planning workstation"
edition = "2021"

[lib]
name = "radioplan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
strip = true
lto = true
